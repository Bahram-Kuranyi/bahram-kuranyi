<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Bahram Kuranyi — Software Engineer</title>
  <desc id="desc">Animated engineering dashboard banner with a terminal, system nodes, and flowing data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.55" stop-color="#090d16"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c2ff"/>
      <stop offset="0.55" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#b45cff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00c2ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00c2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#7b8aa5" stroke-opacity=".09"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="terminalClip"><rect x="72" y="75" width="710" height="276" rx="17"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="36 36" dur="8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="1030" cy="90" r="300" fill="url(#glow)"/>
  <circle cx="1050" cy="220" r="145" fill="none" stroke="#00c2ff" stroke-opacity=".16" stroke-dasharray="4 13">
    <animateTransform attributeName="transform" type="rotate" from="0 1050 220" to="360 1050 220" dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="220" r="100" fill="none" stroke="#8b5cf6" stroke-opacity=".2" stroke-dasharray="2 10">
    <animateTransform attributeName="transform" type="rotate" from="360 1050 220" to="0 1050 220" dur="16s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".72">
    <path d="M827 106C910 106 921 166 982 166S1061 94 1145 94" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M820 315C904 315 930 264 986 264s91 64 170 64" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="0" to="72" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="890" cy="106" r="4" fill="#00c2ff"><animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="982" cy="166" r="4" fill="#8b5cf6"><animate attributeName="opacity" values="1;.25;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1112" cy="101" r="4" fill="#c45cff"><animate attributeName="opacity" values=".25;1;.25" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="875" cy="302" r="4" fill="#00c2ff"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1004" cy="273" r="4" fill="#8b5cf6"><animate attributeName="opacity" values=".25;1;.25" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1135" cy="319" r="4" fill="#c45cff"><animate attributeName="opacity" values="1;.2;1" dur="3.3s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="59" y="62" width="736" height="302" rx="22" fill="#080b12" stroke="#334155" stroke-opacity=".76"/>
  <rect x="72" y="75" width="710" height="276" rx="17" fill="#05070c"/>
  <g clip-path="url(#terminalClip)">
    <rect x="72" y="75" width="710" height="42" fill="#0d121c"/>
    <circle cx="96" cy="96" r="5" fill="#ff5f57"/>
    <circle cx="114" cy="96" r="5" fill="#febc2e"/>
    <circle cx="132" cy="96" r="5" fill="#28c840"/>
    <text x="427" y="101" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">bahram@engineering — zsh</text>

    <text x="98" y="151" fill="#00c2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">❯ whoami</text>
    <text x="98" y="189" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing=".3">Bahram Kuranyi</text>
    <rect x="98" y="204" width="460" height="3" rx="2" fill="url(#accent)"/>
    <text x="98" y="244" fill="#b7c2d3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">Software Engineer · Full-Stack · AI Builder</text>
    <text x="98" y="285" fill="#00c2ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">❯ current_focus</text>
    <text x="98" y="318" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">[ systems ]  [ products ]  [ intelligent software ]</text>
    <rect x="623" y="300" width="10" height="20" fill="#00c2ff">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.48;.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8ea0b9">
    <text x="838" y="58">SYSTEM / ONLINE</text>
    <text x="1033" y="217" text-anchor="middle" fill="#e2e8f0" font-size="13">BUILD</text>
    <text x="1033" y="236" text-anchor="middle" fill="#00c2ff" font-size="11">IDEA → PRODUCT</text>
    <text x="830" y="385">GERMANY · 49.9°N</text>
    <text x="1142" y="385" text-anchor="end">SHIP / LEARN / ITERATE</text>
  </g>

  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="url(#accent)" stroke-opacity=".35"/>
</svg>
